server {
    listen 80;
    server_name localhost;

    # Thư mục chứa code build của Vite
    root /usr/share/nginx/html;
    index index.html;

    # 1. Hỗ trợ SPA Routing (React/TanStack Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. CẤU HÌNH QUAN TRỌNG: Firebase Service Worker
    # Buộc trình duyệt không được cache file này để nhận thông báo mới nhất
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Service-Worker-Allowed /;
        access_log off;
    }

    # 3. Proxy API requests (Fix lỗi 502 và CORS)
    location /api/ {
        # Đảm bảo backend đã chạy và tên service trong docker-compose là 'backend'
        proxy_pass http://backend:8080/; 
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        
        # Các header bổ sung để backend nhận diện đúng IP người dùng
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        
        # Tăng timeout để tránh 504 khi backend xử lý lâu
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 4. Tối ưu hóa cho file tĩnh (Images, JS, CSS)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}