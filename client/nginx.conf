# ---------------------------------------------------------
# 1. Khối chuyển hướng HTTP -> HTTPS
# ---------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name staff.cadsquad.vn;

    # Chuyển hướng mọi yêu cầu HTTP sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------
# 2. Khối chính xử lý HTTPS (SSL)
# ---------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staff.cadsquad.vn;

    # Đường dẫn chứng chỉ SSL (Đã mount từ Host vào Docker)
    ssl_certificate /etc/letsencrypt/live/staff.cadsquad.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staff.cadsquad.vn/privkey.pem;

    # Tối ưu hóa bảo mật SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # --- 1. Hỗ trợ SPA Routing (React/Vite) ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- 2. Firebase Service Worker (QUAN TRỌNG) ---
    # Ngăn trình duyệt cache để nhận thông báo mới nhất ngay lập tức
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Service-Worker-Allowed /;
        access_log off;
    }

    # --- 3. Proxy API Backend (Fix 404/502/CORS) ---
    location /api/ {
        # Không có dấu '/' ở cuối để gửi toàn bộ path sang Backend
        # Request: /api/v1/auth/login -> Backend: /v1/auth/login
        proxy_pass http://backend:8080; 

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        
        # Truyền thông tin IP thật của người dùng
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # --- 4. Tối ưu hóa file tĩnh (Cache 1 năm) ---
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # --- 5. Logging ---
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}