server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Hỗ trợ SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Firebase Service Worker (Giữ nguyên - Rất tốt)
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Service-Worker-Allowed /;
        access_log off;
    }

    # 3. FIX PROXY API: 
    # Nếu bạn muốn giữ lại 'v1' khi gửi sang Backend, hãy dùng cấu hình này:
    location /api/ {
        # Xóa dấu gạch chéo cuối cùng ở 'proxy_pass' để Nginx truyền tiếp toàn bộ path
        # Request: /api/v1/auth/login -> Backend nhận: /v1/auth/login
        proxy_pass http://backend:8080; 

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # 4. Tối ưu file tĩnh
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}