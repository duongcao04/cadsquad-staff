version: '3.8'
name: csd-staff

services:
  database:
    image: postgres:16
    container_name: database
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cadsquaddb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - '${DATA_PATH:-./data}/postgres:/var/lib/postgresql/data'
      - '${LOG_PATH:-./logs}/postgres:/var/log/postgresql'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: cache
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - '${DATA_PATH:-./data}/redis:/data'
    networks:
      - app-network

  backend:
    build: ./server
    container_name: backend
    depends_on:
      database: { condition: service_healthy }
    volumes:
      - '${LOG_PATH:-./logs}/backend:/app/logs'
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: cache
    networks:
      - app-network

  web_client:
    build:
      context: ./client
      args:
        VITE_APP_URL: ${CLIENT_URL}
        VITE_API_ENDPOINT: "/api"
        VITE_FIREBASE_API_KEY: ${FIREBASE_API_KEY}
        VITE_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
    container_name: web_client
    restart: always
    ports:
      - '80:80'
    volumes:
      - '${LOG_PATH:-./logs}/web_client:/var/log/nginx'
    networks:
      - app-network

networks:
  app-network:
    driver: bridge